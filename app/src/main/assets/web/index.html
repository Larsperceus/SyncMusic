<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10142A">
<title>SyncMusic</title>
<style>
@font-face{font-family:Bric;src:url(/font.ttf);font-weight:700}
:root{--night:#10142A;--deep:#1A2040;--raised:#232A52;--line:#2E3664;--coral:#FF7E8B;--sky:#8FD3FF;--mist:#A9AFD3;--cloud:#F1F2FA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--cloud);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 20px 48px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:12px;font:700 22px Bric,system-ui;letter-spacing:-.02em}
.bars{display:flex;gap:3px;align-items:center}.bars i{display:block;width:5px;border-radius:9px}
h1{font:700 32px/1.08 Bric,system-ui;letter-spacing:-.03em;margin:0}
p{margin:0}.muted{color:var(--mist)}.small{font-size:13px}
.card{background:var(--deep);border-radius:24px;padding:16px}
.np{display:flex;gap:14px;align-items:center}
.np img,.np .ph{width:72px;height:72px;border-radius:14px;object-fit:cover;background:var(--raised);flex:none}
.np .t{font:700 19px/1.25 Bric,system-ui}
button{font:600 16px system-ui,-apple-system,sans-serif;border:0;border-radius:18px;cursor:pointer}
.big{height:56px;width:100%;background:var(--sky);color:var(--night)}
.ghost{height:52px;width:100%;background:transparent;color:var(--cloud);border:1px solid var(--line)}
input[type=text]{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--cloud);padding:0 14px;font:16px system-ui}
input[type=range]{width:100%;accent-color:var(--sky)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mist)}
.row{display:flex;gap:10px;align-items:center}
.emoji{display:flex;justify-content:space-between}
.emoji button{width:52px;height:52px;border-radius:50%;background:var(--raised);font-size:24px}
.sendrow{display:flex;gap:8px}.sendrow button{width:56px;background:var(--raised);color:var(--cloud)}
.stat{display:flex;justify-content:space-between;align-items:baseline}
.stat b{font:700 20px Bric,system-ui}.stat span{color:var(--sky);font-size:14px}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;bottom:6%;text-align:center;animation:rise 2.8s ease-out forwards}
.fl b{display:block;font-size:44px;line-height:1}.fl small{color:var(--mist);font-size:11px}
@keyframes rise{to{transform:translateY(-62vh);opacity:0}}
@media (prefers-reduced-motion:reduce){.fl{animation-duration:.01s}}
[hidden]{display:none!important}
a{color:var(--sky)}
</style>
</head>
<body>
<main>
  <div class="logo"><span class="bars"><i style="height:10px;background:var(--coral)"></i><i style="height:20px;background:var(--coral)"></i><i style="height:14px;background:var(--sky)"></i><i style="height:6px;background:var(--sky)"></i></span>SyncMusic</div>

  <div class="card np" id="np" hidden>
    <img id="art" alt="" hidden><div class="ph" id="ph"></div>
    <div><div class="t" id="title"></div><div class="muted small" id="artist"></div></div>
  </div>

  <div>
    <h1 id="head">Listen along</h1>
    <p class="muted" id="sub" style="margin-top:8px">Hear what your friend is playing, in step, on this device.</p>
  </div>

  <div id="setup">
    <label>Your name<input type="text" id="name" maxlength="30" placeholder="Sam" autocomplete="nickname"></label>
    <div style="height:14px"></div>
    <button class="big" id="go">Start listening</button>
  </div>

  <div id="live" hidden style="display:flex;flex-direction:column;gap:18px">
    <div class="card">
      <div class="stat"><b>Delay</b><span id="behind">Measuring…</span></div>
      <input type="range" id="extra" min="0" max="400" step="10" value="0" aria-label="Extra delay">
      <p class="muted small" id="delayNote">If you hear it before the others, add delay.</p>
    </div>
    <div class="emoji" id="emoji"></div>
    <div class="sendrow"><input type="text" id="req" maxlength="120" placeholder="Request a song"><button id="send" aria-label="Send request">➤</button></div>
    <p class="muted small" id="sent" hidden>Request sent.</p>
    <button class="ghost" id="stop">Stop listening</button>
  </div>

  <p class="muted small" id="ios">On iPhone: keep this page open and the screen on.</p>
  <a id="apk" href="/app.apk" hidden>Get the Android app for tighter sync</a>
</main>
<div id="fx"></div>
<audio id="unlock" loop playsinline src="data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA=="></audio>
<script>
"use strict";
const $ = id => document.getElementById(id);
const SR = 48000, BASE = 160;
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
let ctx = null, gain = null, id = null, offset = null, rtt = null, samples = [];
let extra = +(ls("extra") || 0), auto = 0, nextT = null, late = 0, playing = false, kicked = false;
let since = 0, artV = -1, ctrl = null, wake = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
$("name").value = ls("name") || "";
$("extra").value = extra;
if (/Android/i.test(navigator.userAgent)) $("apk").hidden = false;
if (!/iPhone|iPad|iPod/i.test(navigator.userAgent)) $("ios").hidden = true;

["❤️","🔥","🙌","😂","🎉"].forEach(e => {
  const b = document.createElement("button"); b.textContent = e; b.setAttribute("aria-label", "React " + e);
  b.onclick = () => post("/react", { e }); $("emoji").appendChild(b);
});
function post(path, data) {
  data.name = $("name").value.trim() || "Guest";
  return fetch(path, { method: "POST", body: new URLSearchParams(data) }).catch(() => {});
}
function float(r) {
  const d = document.createElement("div"); d.className = "fl";
  d.style.left = (8 + Math.random() * 74) + "%";
  const b = document.createElement("b"); b.textContent = r.e;
  const s = document.createElement("small"); s.textContent = r.name;
  d.append(b, s); $("fx").appendChild(d); setTimeout(() => d.remove(), 3000);
}

async function ping() {
  const t0 = performance.now();
  const r = await fetch("/time?" + Math.random(), { cache: "no-store" });
  const now = +(await r.text()); const t3 = performance.now();
  samples.push([t3 - t0, now - (t0 + t3) / 2]); if (samples.length > 12) samples.shift();
  let best = samples[0]; for (const s of samples) if (s[0] < best[0]) best = s;
  offset = best[1]; rtt = best[0];
}
async function clockLoop() {
  for (let i = 0; i < 8; i++) { try { await ping(); } catch (e) {} await sleep(120); }
  while (true) { try { await ping(); } catch (e) {} await sleep(2000); }
}
async function metaLoop() {
  while (true) {
    try {
      const j = await (await fetch("/meta?id=" + (id || 0) + "&since=" + since, { cache: "no-store" })).json();
      if (j.title) {
        $("np").hidden = false; $("title").textContent = j.title; $("artist").textContent = j.artist;
        if (j.art !== artV) { artV = j.art; if (j.art) { $("art").src = "/art?v=" + j.art; $("art").hidden = false; $("ph").hidden = true; } else { $("art").hidden = true; $("ph").hidden = false; } }
      }
      if (!playing) $("sub").textContent = "Hear what " + j.host + " is playing, in step, on this device.";
      if (gain) gain.gain.value = j.volume;
      if (since > 0 || j.seq === 0) j.reactions.forEach(float);
      since = j.seq;
      if (j.kicked && playing) { kicked = true; stop(); $("head").textContent = "Removed"; $("sub").textContent = j.host + " removed you from the session."; }
    } catch (e) {}
    await sleep(1000);
  }
}

function concat(a, b) { const c = new Uint8Array(a.length + b.length); c.set(a); c.set(b, a.length); return c; }

function schedule(t, bytes) {
  if (offset === null || !ctx) return;
  const n = bytes.length >> 2; if (!n) return;
  const a = new Int16Array(bytes.slice().buffer);
  const ab = ctx.createBuffer(2, n, SR), L = ab.getChannelData(0), R = ab.getChannelData(1);
  for (let i = 0; i < n; i++) { L[i] = a[2 * i] / 32768; R[i] = a[2 * i + 1] / 32768; }
  const localMs = t + BASE + extra + auto - offset;
  let ideal;
  if (ctx.getOutputTimestamp) { const ts = ctx.getOutputTimestamp(); if (ts.performanceTime > 0) ideal = ts.contextTime + (localMs - ts.performanceTime) / 1000; }
  if (ideal === undefined) ideal = ctx.currentTime + (localMs - performance.now()) / 1000 - (ctx.outputLatency || ctx.baseLatency || 0);
  if (nextT === null || Math.abs(ideal - nextT) > 0.04) nextT = ideal;
  if (nextT < ctx.currentTime + 0.01) { late++; nextT = null; return; }
  const s = ctx.createBufferSource(); s.buffer = ab; s.connect(gain); s.start(nextT); nextT += n / SR;
}

async function stream() {
  while (playing) {
    try {
      ctrl = new AbortController();
      const name = $("name").value.trim() || "Browser";
      const r = await fetch("/stream?name=" + encodeURIComponent(name) + "&r=" + Math.random(), { cache: "no-store", signal: ctrl.signal });
      id = +r.headers.get("X-Listener-Id") || null;
      $("head").textContent = "Listening along";
      const rd = r.body.getReader(); let buf = new Uint8Array(0);
      while (true) {
        const { value, done } = await rd.read(); if (done) break;
        buf = buf.length ? concat(buf, value) : value;
        let o = 0;
        while (buf.length - o >= 12) {
          const dv = new DataView(buf.buffer, buf.byteOffset + o, 12);
          const t = dv.getUint32(0) * 4294967296 + dv.getUint32(4), n = dv.getUint32(8);
          if (buf.length - o - 12 < n) break;
          schedule(t, buf.subarray(o + 12, o + 12 + n)); o += 12 + n;
        }
        buf = buf.slice(o);
      }
    } catch (e) {}
    if (!playing || kicked) return;
    $("head").textContent = "Reconnecting…"; await sleep(1500);
  }
}

setInterval(() => {
  if (!playing) return;
  if (late > 15 && auto < 600) auto += 40;
  late = 0;
  const total = BASE + extra + auto;
  $("behind").textContent = offset === null ? "Measuring…" : total + " ms behind";
  $("delayNote").textContent = auto ? "This browser needed " + auto + " ms extra, so it may be a little behind the app." : "If you hear it before the others, add delay.";
}, 2000);

$("extra").oninput = e => { extra = +e.target.value; ls("extra", extra); nextT = null; };
$("go").onclick = async () => {
  ls("name", $("name").value.trim());
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  $("unlock").play().catch(() => {});
  const AC = window.AudioContext || window.webkitAudioContext;
  try { ctx = new AC({ sampleRate: SR, latencyHint: "interactive" }); } catch (e) { ctx = new AC(); }
  gain = ctx.createGain(); gain.connect(ctx.destination); await ctx.resume();
  try { wake = await navigator.wakeLock.request("screen"); } catch (e) {}
  playing = true; kicked = false; $("setup").hidden = true; $("live").hidden = false;
  $("head").textContent = "Joining…"; stream();
};
function stop() {
  playing = false; if (ctrl) ctrl.abort(); if (ctx) ctx.close(); ctx = null; nextT = null;
  $("unlock").pause(); if (wake) wake.release().catch(() => {});
  $("live").hidden = true; $("setup").hidden = false; $("head").textContent = "Listen along";
}
$("stop").onclick = stop;
$("send").onclick = () => {
  const v = $("req").value.trim(); if (!v) return;
  post("/request", { text: v }); $("req").value = ""; $("sent").hidden = false; setTimeout(() => $("sent").hidden = true, 2500);
};
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && playing) { try { wake = await navigator.wakeLock.request("screen"); } catch (e) {} if (ctx && ctx.state !== "running") ctx.resume(); }
});
clockLoop(); metaLoop();
</script>
</body>
</html>
