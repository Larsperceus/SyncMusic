name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk SyncMusic.apk && ls -la SyncMusic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SyncMusic-apk
          path: SyncMusic.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SyncMusic build ${{ github.run_number }}
          body: Tap SyncMusic.apk below to download and install. Builds from 4 on are signed with the same key, so they install over each other.
          files: SyncMusic.apk
          make_latest: true
